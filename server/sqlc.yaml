version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/identity/auth
    gen:
      go:
        package: authdb
        out: internal/identity/auth/internal/authdb
        <<: &go_options
          sql_package: pgx/v5
          output_files_suffix: .gen
          output_db_file_name: db.gen.go
          output_models_file_name: models.gen.go
          emit_interface: false
          emit_empty_slices: true
          omit_unused_structs: true
          emit_pointers_for_null_types: true
          overrides:
            - db_type: timestamptz
              go_type: time.Time
            - db_type: timestamptz
              nullable: true
              go_type:
                type: time.Time
                pointer: true
            - db_type: uuid
              go_type: github.com/google/uuid.UUID
            - db_type: uuid
              nullable: true
              go_type:
                import: github.com/google/uuid
                type: UUID
                pointer: true
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/identity/family
    gen:
      go:
        package: familydb
        out: internal/identity/family/internal/familydb
        <<: *go_options
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/identity/profile
    gen:
      go:
        package: profiledb
        out: internal/identity/profile/internal/profiledb
        <<: *go_options
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/meals/meal
    gen:
      go:
        package: mealdb
        out: internal/meals/meal/internal/mealdb
        <<: *go_options
        output_copyfrom_file_name: copyfrom.gen.go
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: pg_catalog.int2
            go_type: int
          - db_type: pg_catalog.int2
            nullable: true
            go_type:
              type: int
              pointer: true
          - db_type: pg_catalog.int4
            go_type: int
          - db_type: pg_catalog.int4
            nullable: true
            go_type:
              type: int
              pointer: true
          - db_type: pg_catalog.numeric
            go_type: float64
          - db_type: pg_catalog.numeric
            nullable: true
            go_type:
              type: float64
              pointer: true
