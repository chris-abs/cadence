version: "2"
# One entry per domain. Each domain's queries live in db/queries/<domain>/ and
# generate into internal/<domain>/internal/<domain>db, which Go's internal/
# rule makes importable only from inside that domain. Every domain reads the
# whole migration history as its schema but may query only its own tables
# (checked by internal/archtest). A new domain copies the identity entry and
# changes queries, package and out; the shared options come from the anchor.
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/identity
    gen:
      go:
        package: identitydb
        out: internal/identity/internal/identitydb
        <<: &go_options
          sql_package: pgx/v5
          output_files_suffix: .gen
          output_db_file_name: db.gen.go
          output_models_file_name: models.gen.go
          emit_interface: false
          emit_empty_slices: true
          # Nullable columns become pointers (*string, *time.Time) rather than
          # pgtype wrappers, so rows map onto the API types directly.
          emit_pointers_for_null_types: true
          overrides:
            # Plain time.Time rather than pgtype.Timestamptz for NOT NULL columns.
            - db_type: timestamptz
              go_type: time.Time
            - db_type: timestamptz
              nullable: true
              go_type:
                type: time.Time
                pointer: true
            # google/uuid (UUIDv7 generation lives in Go) instead of pgtype.UUID.
            - db_type: uuid
              go_type: github.com/google/uuid.UUID
            - db_type: uuid
              nullable: true
              go_type:
                import: github.com/google/uuid
                type: UUID
                pointer: true
