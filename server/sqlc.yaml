version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/auth
    gen:
      go:
        package: authdb
        out: internal/auth/internal/authdb
        <<: &go_options
          sql_package: pgx/v5
          output_files_suffix: .gen
          output_db_file_name: db.gen.go
          output_models_file_name: models.gen.go
          emit_interface: false
          emit_empty_slices: true
          emit_pointers_for_null_types: true
          overrides:
            - db_type: timestamptz
              go_type: time.Time
            - db_type: timestamptz
              nullable: true
              go_type:
                type: time.Time
                pointer: true
            - db_type: uuid
              go_type: github.com/google/uuid.UUID
            - db_type: uuid
              nullable: true
              go_type:
                import: github.com/google/uuid
                type: UUID
                pointer: true
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/family
    gen:
      go:
        package: familydb
        out: internal/family/internal/familydb
        <<: *go_options
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/profile
    gen:
      go:
        package: profiledb
        out: internal/profile/internal/profiledb
        <<: *go_options
