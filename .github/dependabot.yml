# Dependency updates: monthly, one grouped PR per ecosystem to keep upkeep low.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: monthly
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: npm # also handles yarn.lock
    directory: /client
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
