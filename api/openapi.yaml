openapi: 3.0.3
info:
  title: Cadence API
  version: 0.3.0
  description: >
    Contract between the Cadence web client and the Go API. Change this file
    first, run `make gen`, then implement both sides. Identity rules (who may
    call what, session lifetimes, lockout) are specified in
    `docs/spec/identity.md` and meals rules in `docs/spec/meals.md`; this file
    is the wire format.
servers:
  - url: /api
tags:
  - name: system
  - name: auth
    description: Family sign-in, profile sessions and devices.
  - name: family
    description: The family account. Needs a profile session.
  - name: profiles
  - name: modules
    description: Feature modules a family can enable or disable.
  - name: meals
    description: >
      A family's meals and their recipes. Needs a profile session and the
      meals module enabled, as do the three tags below.
  - name: recipe-book
    description: Cadence's own meals, which a family's meals start as a copy of.
  - name: meal-plan
    description: Meals or free text on the days of a week.
  - name: shopping
    description: One shopping list per week, generated from the plan.
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness and database connectivity check
      tags: [system]
      responses:
        "200":
          description: The API is up and can reach its database.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The API is up but cannot reach its database.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # --- auth -----------------------------------------------------------------
  /auth/registration:
    get:
      operationId: getRegistrationStatus
      summary: Whether a new family can register right now
      tags: [auth]
      security: []
      responses:
        "200":
          description: Registration status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationStatus"
  /auth/register:
    post:
      operationId: registerFamily
      summary: Create a family, its owner profile, and sign this device in as the owner
      description: >
        One transaction. Sets both the family and the profile session cookie.
        Rate limited per IP. Closed unless `ALLOW_REGISTRATION` permits it.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Family created; both session cookies set.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookies"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/login:
    post:
      operationId: login
      summary: Sign this device in to a family
      description: >
        Replaces any family session this device already has. Unknown email and
        wrong password both answer `401 invalid_credentials`.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in; family session cookie set.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookies"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilySession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/logout:
    post:
      operationId: logout
      summary: Sign this device out of the family
      description: >
        Deletes this device's family session and its profile session, and
        clears both cookies. Idempotent: succeeds without a valid session.
      tags: [auth]
      security:
        - {}
        - familySession: []
      responses:
        "204":
          description: Signed out; both cookies cleared.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookies"
  /auth/session:
    get:
      operationId: getFamilySession
      summary: The signed-in family and its profile picker
      description: Bootstrap call for a device with a family session.
      tags: [auth]
      security:
        - familySession: []
      responses:
        "200":
          description: The family session is valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilySession"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/profile-session:
    post:
      operationId: selectProfile
      summary: Switch this device to a profile
      description: >
        Replaces this device's profile session, if any. `pin` is required when
        the profile has one. Wrong PINs count towards the profile's lockout.
      tags: [auth]
      security:
        - familySession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectProfileRequest"
      responses:
        "200":
          description: Profile selected; profile session cookie set.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookies"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      operationId: lockProfile
      summary: Lock this device back to the profile picker
      description: >
        Deletes this device's profile session and clears its cookie. Needs only
        the family session, so it works after the profile session has expired.
        Idempotent.
      tags: [auth]
      security:
        - familySession: []
      responses:
        "204":
          description: Locked; profile session cookie cleared.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookies"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/sessions:
    get:
      operationId: listSessions
      summary: Devices signed in to this family
      tags: [auth]
      security:
        - familySession: []
          profileSession: []
      responses:
        "200":
          description: One entry per family session (device).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceSessionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /auth/sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    delete:
      operationId: revokeSession
      summary: Sign one device out
      description: >
        Deletes that family session and its profile session. Revoking the
        current device also clears this device's cookies.
      tags: [auth]
      security:
        - familySession: []
          profileSession: []
      responses:
        "204":
          description: Device signed out.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /auth/sessions/revoke-others:
    post:
      operationId: revokeOtherSessions
      summary: Sign out every device except this one
      tags: [auth]
      security:
        - familySession: []
          profileSession: []
      responses:
        "204":
          description: All other devices signed out.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # --- me -------------------------------------------------------------------
  /me:
    get:
      operationId: getMe
      summary: The current profile, its rights and the enabled modules
      tags: [auth]
      security:
        - familySession: []
          profileSession: []
      responses:
        "200":
          description: The profile session is valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # --- family ---------------------------------------------------------------
  /family:
    get:
      operationId: getFamily
      summary: The family account, including its email
      tags: [family]
      security:
        - familySession: []
          profileSession: []
      responses:
        "200":
          description: The family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Family"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: updateFamily
      summary: Edit the family's name and auto-lock setting
      tags: [family]
      security:
        - familySession: []
          profileSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFamilyRequest"
      responses:
        "200":
          description: Updated family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Family"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /family/email:
    put:
      operationId: changeFamilyEmail
      summary: Change the sign-in email (owner, re-enters the password)
      tags: [family]
      security:
        - familySession: []
          profileSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeEmailRequest"
      responses:
        "200":
          description: Updated family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Family"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
  /family/password:
    put:
      operationId: changeFamilyPassword
      summary: Change the family password (owner)
      description: Signs out every other device.
      tags: [family]
      security:
        - familySession: []
          profileSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
  /family/owner:
    post:
      operationId: transferOwnership
      summary: Make another PARENT profile the owner (owner, re-enters the password)
      tags: [family]
      security:
        - familySession: []
          profileSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferOwnershipRequest"
      responses:
        "204":
          description: Ownership transferred.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
  /family/delete:
    post:
      operationId: deleteFamily
      summary: Permanently delete the family and all its data (owner)
      description: >
        Immediate and irreversible. Needs the password and the family name
        typed again. Clears both cookies on this device.
      tags: [family]
      security:
        - familySession: []
          profileSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteFamilyRequest"
      responses:
        "204":
          description: Family deleted; both cookies cleared.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookies"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"

  # --- profiles -------------------------------------------------------------
  /profiles:
    get:
      operationId: listProfiles
      summary: The family's profiles (the picker)
      tags: [profiles]
      security:
        - familySession: []
      responses:
        "200":
          description: All profiles, owner first, then by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createProfile
      summary: Add a profile (PARENT)
      tags: [profiles]
      security:
        - familySession: []
          profileSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProfileRequest"
      responses:
        "201":
          description: Profile created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /profiles/{profileId}:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    get:
      operationId: getProfile
      summary: One profile of this family
      tags: [profiles]
      security:
        - familySession: []
          profileSession: []
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateProfile
      summary: Replace a profile's display fields (self, or any profile for a PARENT)
      tags: [profiles]
      security:
        - familySession: []
          profileSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      operationId: deleteProfile
      summary: Remove a profile (PARENT; not self, not the owner)
      tags: [profiles]
      security:
        - familySession: []
          profileSession: []
      responses:
        "204":
          description: Profile deleted with its sessions.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /profiles/{profileId}/role:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    put:
      operationId: changeProfileRole
      summary: Change a profile's role (PARENT; not self, not the owner)
      tags: [profiles]
      security:
        - familySession: []
          profileSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeRoleRequest"
      responses:
        "200":
          description: Updated profile; its profile sessions are signed out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /profiles/{profileId}/pin:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    put:
      operationId: setProfilePin
      summary: Set, change, remove or reset a profile's PIN
      description: >
        `pin: null` removes the PIN. The proof needed depends on actor and
        target (identity spec §2): `currentPin` or `password` for your own
        existing PIN, nothing for a parent resetting a child (or the owner
        resetting another parent).
      tags: [profiles]
      security:
        - familySession: []
          profileSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPinRequest"
      responses:
        "204":
          description: PIN updated; lockout cleared; the target's other sessions signed out.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"

  # --- modules --------------------------------------------------------------
  /modules:
    get:
      operationId: listModules
      summary: Every module in the catalogue with this family's enabled state
      tags: [modules]
      security:
        - familySession: []
          profileSession: []
      responses:
        "200":
          description: The module catalogue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /modules/{moduleId}:
    parameters:
      - $ref: "#/components/parameters/ModuleId"
    put:
      operationId: setModuleEnabled
      summary: Enable or disable a module for the family (PARENT)
      tags: [modules]
      security:
        - familySession: []
          profileSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetModuleEnabledRequest"
      responses:
        "200":
          description: The module with its new state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Module"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # --- meals ----------------------------------------------------------------
  /meals:
    get:
      operationId: listMeals
      summary: The family's meals, sorted by name
      tags: [meals]
      security:
        - familySession: []
          profileSession: []
      parameters:
        - name: q
          in: query
          description: Case-insensitive match anywhere in the name.
          schema:
            type: string
            maxLength: 120
      responses:
        "200":
          description: >
            Matching meals. While the recipe book is off, unedited copies of
            book meals are left out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createMeal
      summary: Add a meal, with its ingredients, micros and optional recipe (PARENT)
      tags: [meals]
      security:
        - familySession: []
          profileSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveMealRequest"
      responses:
        "201":
          description: Meal created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /meals/{mealId}:
    parameters:
      - $ref: "#/components/parameters/MealId"
    get:
      operationId: getMeal
      summary: One meal in full, with its recipe if it has one
      tags: [meals]
      security:
        - familySession: []
          profileSession: []
      responses:
        "200":
          description: The meal. Readable by id even while the recipe book is off.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateMeal
      summary: Replace a meal and everything in it (PARENT)
      description: >
        Replaces every field, the ingredients, the micros and the recipe.
        Anything left out is cleared; leaving `recipe` out removes the recipe.
        A copy of a book meal becomes `edited`.
      tags: [meals]
      security:
        - familySession: []
          profileSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveMealRequest"
      responses:
        "200":
          description: Updated meal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      operationId: deleteMeal
      summary: Delete a meal and its recipe (PARENT)
      tags: [meals]
      security:
        - familySession: []
          profileSession: []
      responses:
        "204":
          description: >
            Meal deleted. Plan entries that used it remain as free text with
            its last name.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /ingredient-names:
    get:
      operationId: listIngredientNames
      summary: Ingredient names the family has already used, for typing them the same way
      tags: [meals]
      security:
        - familySession: []
          profileSession: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 80
      responses:
        "200":
          description: Up to 10 matching names.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngredientNameList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  # --- recipe book ----------------------------------------------------------
  /recipe-book:
    get:
      operationId: getRecipeBook
      summary: Whether the book is on, and every book meal with where the family stands on it
      tags: [recipe-book]
      security:
        - familySession: []
          profileSession: []
      responses:
        "200":
          description: The recipe book, sorted by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeBook"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: setRecipeBookEnabled
      summary: Turn the recipe book on or off for the family (PARENT)
      description: >
        Off: unedited copies of book meals leave the meal list. Nothing is
        deleted and plan entries keep their meals. On: they return unchanged.
      tags: [recipe-book]
      security:
        - familySession: []
          profileSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetRecipeBookEnabledRequest"
      responses:
        "200":
          description: The recipe book with its new state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeBook"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /recipe-book/meals/{bookMealId}:
    parameters:
      - $ref: "#/components/parameters/BookMealId"
    get:
      operationId: getBookMeal
      summary: One book meal in full, as Cadence ships it
      tags: [recipe-book]
      security:
        - familySession: []
          profileSession: []
      responses:
        "200":
          description: The book meal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookMeal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /recipe-book/meals/{bookMealId}/adopt:
    parameters:
      - $ref: "#/components/parameters/BookMealId"
    post:
      operationId: adoptBookMeal
      summary: Take the book's current version of a meal (PARENT)
      description: >
        Adds the meal if the family has no copy. If it has one, edited or not,
        its content is overwritten with the book's and it keeps its id.
      tags: [recipe-book]
      security:
        - familySession: []
          profileSession: []
      responses:
        "200":
          description: The family's meal, now matching the book.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  # --- meal plan ------------------------------------------------------------
  /meal-plan:
    get:
      operationId: getMealPlan
      summary: Plan entries between two dates
      tags: [meal-plan]
      security:
        - familySession: []
          profileSession: []
      parameters:
        - name: from
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Date"
        - name: to
          in: query
          required: true
          description: Inclusive; at most 42 days from `from`.
          schema:
            $ref: "#/components/schemas/Date"
      responses:
        "200":
          description: Entries ordered by date, slot and position.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealPlan"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /meal-plan/entries:
    post:
      operationId: createPlanEntry
      summary: Put a meal or free text on a day (PARENT)
      tags: [meal-plan]
      security:
        - familySession: []
          profileSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlanEntryRequest"
      responses:
        "201":
          description: Entry created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /meal-plan/entries/{entryId}:
    parameters:
      - $ref: "#/components/parameters/PlanEntryId"
    patch:
      operationId: updatePlanEntry
      summary: Move or change a plan entry (PARENT)
      tags: [meal-plan]
      security:
        - familySession: []
          profileSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlanEntryRequest"
      responses:
        "200":
          description: Updated entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      operationId: deletePlanEntry
      summary: Remove a plan entry (PARENT)
      tags: [meal-plan]
      security:
        - familySession: []
          profileSession: []
      responses:
        "204":
          description: Entry deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # --- shopping -------------------------------------------------------------
  /shopping-lists/{weekStart}:
    parameters:
      - $ref: "#/components/parameters/WeekStart"
    get:
      operationId: getShoppingList
      summary: A week's shopping list with its items
      tags: [shopping]
      security:
        - familySession: []
          profileSession: []
      responses:
        "200":
          description: The list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`not_found`: no list has been made for this week yet."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /shopping-lists/{weekStart}/generate:
    parameters:
      - $ref: "#/components/parameters/WeekStart"
    post:
      operationId: generateShoppingList
      summary: Create or regenerate the week's list from the plan (PARENT)
      description: >
        Merges the ingredients of the week's meal entries. Manual items are
        untouched; a line still needed keeps its tick unless its quantity
        went up.
      tags: [shopping]
      security:
        - familySession: []
          profileSession: []
      responses:
        "200":
          description: The generated list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /shopping-lists/{weekStart}/items:
    parameters:
      - $ref: "#/components/parameters/WeekStart"
    post:
      operationId: createShoppingItem
      summary: Add a manual item; creates the week's list if there is none (PARENT)
      tags: [shopping]
      security:
        - familySession: []
          profileSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShoppingItemRequest"
      responses:
        "201":
          description: Item added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /shopping-items/{itemId}:
    parameters:
      - $ref: "#/components/parameters/ShoppingItemId"
    patch:
      operationId: updateShoppingItem
      summary: Tick or untick an item (anyone); edit a manual item (PARENT)
      tags: [shopping]
      security:
        - familySession: []
          profileSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateShoppingItemRequest"
      responses:
        "200":
          description: Updated item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      operationId: deleteShoppingItem
      summary: Delete a manual item (PARENT)
      tags: [shopping]
      security:
        - familySession: []
          profileSession: []
      responses:
        "204":
          description: Item deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

components:
  securitySchemes:
    familySession:
      type: apiKey
      in: cookie
      name: cadence_family
      description: >
        Family session (a signed-in device). httpOnly, SameSite=Strict. Named
        `__Host-cadence_family` and Secure outside development.
    profileSession:
      type: apiKey
      in: cookie
      name: cadence_profile
      description: >
        Profile session, valid only together with the family session it was
        created under. httpOnly, SameSite=Strict. Named
        `__Host-cadence_profile` and Secure outside development.

  parameters:
    ProfileId:
      name: profileId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    ModuleId:
      name: moduleId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ModuleId"
    MealId:
      name: mealId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    BookMealId:
      name: bookMealId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    PlanEntryId:
      name: entryId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    ShoppingItemId:
      name: itemId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    WeekStart:
      name: weekStart
      in: path
      required: true
      description: The Monday the week starts on; any other weekday is refused (422).
      schema:
        $ref: "#/components/schemas/Date"

  headers:
    SetSessionCookies:
      description: >
        Sets or clears `cadence_family` / `cadence_profile` (httpOnly; the
        client never reads them).
      schema:
        type: string

  responses:
    BadRequest:
      description: "Malformed body or unknown field: `invalid_request`."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: >
        `family_session_required` (go to login), `profile_session_required`
        (go to the picker) or `invalid_credentials` (login failed).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: >
        `forbidden`, `invalid_pin`, `invalid_password`, `module_disabled`,
        `registration_closed` or `cross_origin`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: "`not_found`, also for another family's ids."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: >
        `email_taken`, `name_taken`, `owner_protected`, `self_not_allowed`,
        `profile_limit_reached` or `recipe_book_off`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationFailed:
      description: "`validation_failed` with per-field messages in `fields`."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: "`rate_limited` or `pin_locked`, with `retryAfterSeconds`."
      headers:
        Retry-After:
          description: Seconds until a retry can succeed.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: >
                Stable machine-readable code, e.g. `invalid_request`. The
                identity codes are listed in `docs/spec/identity.md` §7. Any
                path answers a method it does not support with
                `405 method_not_allowed` (and an `Allow` header), an unknown
                path with `404 not_found`.
            message:
              type: string
              description: Human-readable message, safe to show to users.
            fields:
              type: object
              description: >
                Per-field validation messages (with `validation_failed`). Each
                key is the dotted JSON path of the field in the request body,
                e.g. `password` or `owner.name`.
              additionalProperties:
                type: string
            retryAfterSeconds:
              type: integer
              minimum: 1
              description: Set with `rate_limited` and `pin_locked`.

    # Ids are UUIDv7 strings. Kept as plain strings in Go so the generated
    # types need no runtime library; handlers parse them with google/uuid.
    Id:
      type: string
      format: uuid
      x-go-type: string
    ModuleId:
      type: string
      pattern: "^[a-z][a-z0-9_]{1,31}$"
      description: A module from the server's catalogue, e.g. `meals`.
      example: meals
    Role:
      type: string
      enum: [PARENT, CHILD]
    ProfileColour:
      type: string
      enum:
        [
          slate,
          gray,
          zinc,
          neutral,
          stone,
          red,
          orange,
          amber,
          yellow,
          lime,
          green,
          emerald,
          teal,
          cyan,
          sky,
          blue,
          indigo,
          violet,
          purple,
          fuchsia,
          pink,
          rose,
        ]
    Email:
      type: string
      format: email
      x-go-type: string
      maxLength: 254
      description: Trimmed and lower-cased by the server.
    Password:
      type: string
      minLength: 10
      maxLength: 72
      description: 10–72 characters and at most 72 bytes UTF-8.
    Pin:
      type: string
      pattern: "^[0-9]{6}$"
    ProfileName:
      type: string
      minLength: 1
      maxLength: 40
    Avatar:
      type: string
      pattern: "^[a-z0-9-]{1,32}$"
      description: Key of a built-in avatar; absent or null shows initials.
    Timezone:
      type: string
      description: IANA time zone name, e.g. `Europe/London`.
      example: Europe/London
    DeviceName:
      type: string
      maxLength: 60
      description: Label shown in the device list, e.g. "Kitchen tablet".

    RegistrationStatus:
      type: object
      required: [open]
      properties:
        open:
          type: boolean
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, familyName, owner]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        password:
          $ref: "#/components/schemas/Password"
        familyName:
          type: string
          minLength: 1
          maxLength: 60
        owner:
          $ref: "#/components/schemas/NewOwnerProfile"
        deviceName:
          $ref: "#/components/schemas/DeviceName"
    NewOwnerProfile:
      type: object
      additionalProperties: false
      required: [name, colour, timezone]
      properties:
        name:
          $ref: "#/components/schemas/ProfileName"
        colour:
          $ref: "#/components/schemas/ProfileColour"
        avatar:
          $ref: "#/components/schemas/Avatar"
        timezone:
          $ref: "#/components/schemas/Timezone"
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          maxLength: 254
        password:
          type: string
          maxLength: 72
        deviceName:
          $ref: "#/components/schemas/DeviceName"
    SelectProfileRequest:
      type: object
      additionalProperties: false
      required: [profileId]
      properties:
        profileId:
          $ref: "#/components/schemas/Id"
        pin:
          $ref: "#/components/schemas/Pin"

    FamilySummary:
      type: object
      required: [id, name, autoLockMinutes]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        autoLockMinutes:
          type: integer
          minimum: 1
          maximum: 30
          description: Lock back to the picker after this long without a touch.
    FamilySession:
      type: object
      required: [family, profiles]
      properties:
        family:
          $ref: "#/components/schemas/FamilySummary"
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/ProfileSummary"
    Family:
      type: object
      required: [id, name, email, autoLockMinutes, passwordChangedAt, createdAt, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        email:
          type: string
        autoLockMinutes:
          type: integer
        passwordChangedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UpdateFamilyRequest:
      type: object
      additionalProperties: false
      required: [name, autoLockMinutes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        autoLockMinutes:
          type: integer
          minimum: 1
          maximum: 30
    ChangeEmailRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        password:
          type: string
          maxLength: 72
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          maxLength: 72
        newPassword:
          $ref: "#/components/schemas/Password"
    TransferOwnershipRequest:
      type: object
      additionalProperties: false
      required: [profileId, password]
      properties:
        profileId:
          $ref: "#/components/schemas/Id"
        password:
          type: string
          maxLength: 72
    DeleteFamilyRequest:
      type: object
      additionalProperties: false
      required: [password, confirmName]
      properties:
        password:
          type: string
          maxLength: 72
        confirmName:
          type: string
          description: The family name, typed again (trimmed, case-insensitive).

    ProfileSummary:
      type: object
      description: >
        Picker view, readable with only the family session. Never carries
        contact details.
      required: [id, name, role, isOwner, colour, avatar, timezone, hasPin, lockedUntil, lockedForSeconds, createdAt, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        isOwner:
          type: boolean
        colour:
          $ref: "#/components/schemas/ProfileColour"
        avatar:
          type: string
          nullable: true
        timezone:
          type: string
        hasPin:
          type: boolean
        lockedUntil:
          type: string
          format: date-time
          nullable: true
          description: Set while wrong PINs have locked this profile.
        lockedForSeconds:
          type: integer
          minimum: 1
          nullable: true
          description: >
            Seconds left on the lockout, computed when the response was made
            (rounded up), so the picker countdown does not depend on the
            device clock. Null when not locked.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Profile:
      type: object
      description: >
        Full view of a profile. The contact fields are filled only when the
        caller is this profile or a PARENT; for anyone else they are null.
      required: [id, name, role, isOwner, colour, avatar, timezone, hasPin, lockedUntil, contactEmail, contactEmailVerifiedAt, createdAt, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        isOwner:
          type: boolean
        colour:
          $ref: "#/components/schemas/ProfileColour"
        avatar:
          type: string
          nullable: true
        timezone:
          type: string
        hasPin:
          type: boolean
        lockedUntil:
          type: string
          format: date-time
          nullable: true
          description: Set while wrong PINs have locked this profile.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        contactEmail:
          type: string
          nullable: true
          description: >
            Optional address for notifications only; never a sign-in
            credential, not unique. Nothing is sent to it until verified.
        contactEmailVerifiedAt:
          type: string
          format: date-time
          nullable: true
          description: Null until verified (not in v1); reset when the address changes.
    ProfileList:
      type: object
      required: [profiles]
      properties:
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/ProfileSummary"
    CreateProfileRequest:
      type: object
      additionalProperties: false
      required: [name, role, colour]
      properties:
        name:
          $ref: "#/components/schemas/ProfileName"
        role:
          $ref: "#/components/schemas/Role"
        colour:
          $ref: "#/components/schemas/ProfileColour"
        avatar:
          $ref: "#/components/schemas/Avatar"
        timezone:
          $ref: "#/components/schemas/Timezone"
        pin:
          $ref: "#/components/schemas/Pin"
        contactEmail:
          $ref: "#/components/schemas/Email"
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      description: >
        Full replacement of the display fields; `avatar` or `contactEmail`
        null clears it.
      required: [name, colour, avatar, timezone, contactEmail]
      properties:
        name:
          $ref: "#/components/schemas/ProfileName"
        colour:
          $ref: "#/components/schemas/ProfileColour"
        avatar:
          type: string
          pattern: "^[a-z0-9-]{1,32}$"
          nullable: true
        timezone:
          $ref: "#/components/schemas/Timezone"
        contactEmail:
          type: string
          format: email
          x-go-type: string
          maxLength: 254
          nullable: true
          description: Trimmed and lower-cased by the server.
    ChangeRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/Role"
    SetPinRequest:
      type: object
      additionalProperties: false
      required: [pin]
      properties:
        pin:
          type: string
          pattern: "^[0-9]{6}$"
          nullable: true
          description: The new PIN, or null to remove it.
        currentPin:
          $ref: "#/components/schemas/Pin"
        password:
          type: string
          maxLength: 72
          description: Family password, as proof for a PARENT's own forgotten PIN.

    Me:
      type: object
      required: [profile, family, permissions, modules, pinAdvised, session]
      properties:
        profile:
          $ref: "#/components/schemas/Profile"
        family:
          $ref: "#/components/schemas/FamilySummary"
        permissions:
          type: array
          description: >
            Every right this profile has now, as `<module>.<action>`; identity
            rights use the `family` prefix (e.g. `family.profiles.create`,
            `meals.recipes.edit`). Only enabled modules appear.
          items:
            type: string
        modules:
          type: array
          description: Enabled modules, for navigation.
          items:
            $ref: "#/components/schemas/Module"
        pinAdvised:
          type: boolean
          description: A PARENT without a PIN in a family that has a CHILD profile.
        session:
          $ref: "#/components/schemas/ProfileSessionInfo"
    ProfileSessionInfo:
      type: object
      required: [expiresAt, idleTimeoutSeconds]
      properties:
        expiresAt:
          type: string
          format: date-time
          description: Absolute end of this profile session.
        idleTimeoutSeconds:
          type: integer
          description: Server-side idle limit (backstop for the client's auto-lock).

    Module:
      type: object
      required: [id, name, description, enabled]
      properties:
        id:
          $ref: "#/components/schemas/ModuleId"
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
    ModuleList:
      type: object
      required: [modules]
      properties:
        modules:
          type: array
          items:
            $ref: "#/components/schemas/Module"
    SetModuleEnabledRequest:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean

    DeviceSession:
      type: object
      required: [id, deviceName, userAgent, createdAt, lastSeenAt, current, activeProfileId, activeProfileName]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        deviceName:
          type: string
          nullable: true
        userAgent:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        current:
          type: boolean
          description: This is the device making the request.
        activeProfileId:
          type: string
          format: uuid
          x-go-type: string
          nullable: true
        activeProfileName:
          type: string
          nullable: true
    DeviceSessionList:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/DeviceSession"

    # --- meals ---
    Date:
      type: string
      format: date
      x-go-type: string
      description: A calendar date, `YYYY-MM-DD`, with no time zone.
      example: "2026-11-16"
    Unit:
      type: string
      enum: [g, kg, oz, lb, ml, l, tsp, tbsp, cup, clove, slice, tin, pack, bunch, pinch]
    IngredientCategory:
      type: string
      description: The part of the shop an ingredient is found in.
      enum: [produce, meat, fish, dairy, bakery, tins, dry_goods, frozen, drinks, household, other]
    Allergen:
      type: string
      enum:
        [
          celery,
          cereals_gluten,
          crustaceans,
          eggs,
          fish,
          lupin,
          milk,
          molluscs,
          mustard,
          peanuts,
          sesame,
          soya,
          sulphites,
          tree_nuts,
        ]
    DietaryTag:
      type: string
      enum: [vegetarian, vegan, pescatarian, gluten_free, dairy_free, nut_free, halal, kosher]
    Nutrient:
      type: string
      description: >
        A micronutrient. Amounts are in µg for `vitamin_a`, `vitamin_d`,
        `vitamin_k`, `vitamin_b12` and `folate`, and in mg for the rest.
      enum:
        [
          vitamin_a,
          vitamin_c,
          vitamin_d,
          vitamin_e,
          vitamin_k,
          vitamin_b6,
          vitamin_b12,
          folate,
          calcium,
          iron,
          magnesium,
          potassium,
          zinc,
        ]
    MealSlot:
      type: string
      enum: [breakfast, lunch, dinner, snack]
    BookStatus:
      type: string
      description: >
        Where the family stands on a book meal. `not_added`: no copy.
        `current`: an unedited copy that matches the book. `update_available`:
        an unedited copy and the book has changed since. `edited`: the family
        has changed its copy.
      enum: [not_added, current, update_available, edited]

    Macros:
      type: object
      additionalProperties: false
      description: >
        Per serving, typed in, never calculated. Responses always carry every
        field; a value not given is null.
      properties:
        calories:
          type: integer
          minimum: 0
          nullable: true
          description: kcal.
        proteinG:
          type: number
          format: double
          minimum: 0
          nullable: true
        carbsG:
          type: number
          format: double
          minimum: 0
          nullable: true
        sugarG:
          type: number
          format: double
          minimum: 0
          nullable: true
        fatG:
          type: number
          format: double
          minimum: 0
          nullable: true
        saturatedFatG:
          type: number
          format: double
          minimum: 0
          nullable: true
        fibreG:
          type: number
          format: double
          minimum: 0
          nullable: true
        saltG:
          type: number
          format: double
          minimum: 0
          nullable: true
    Micro:
      type: object
      additionalProperties: false
      required: [nutrient, amount]
      properties:
        nutrient:
          $ref: "#/components/schemas/Nutrient"
        amount:
          type: number
          format: double
          minimum: 0
          description: Per serving, in the nutrient's unit.
    Ingredient:
      type: object
      required: [quantity, unit, name, note, category]
      properties:
        quantity:
          type: number
          format: double
          nullable: true
        unit:
          allOf:
            - $ref: "#/components/schemas/Unit"
          nullable: true
          description: Null with a quantity is a count ("2 onions").
        name:
          type: string
        note:
          type: string
          description: Preparation, e.g. "finely chopped". Empty when none.
        category:
          allOf:
            - $ref: "#/components/schemas/IngredientCategory"
          nullable: true
    IngredientInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        quantity:
          type: number
          format: double
          exclusiveMinimum: true
          minimum: 0
          nullable: true
        unit:
          allOf:
            - $ref: "#/components/schemas/Unit"
          nullable: true
          description: A unit without a quantity is refused.
        name:
          type: string
          minLength: 1
          maxLength: 80
        note:
          type: string
          maxLength: 200
        category:
          allOf:
            - $ref: "#/components/schemas/IngredientCategory"
          nullable: true
    Recipe:
      type: object
      description: How to cook a meal.
      required: [instructions, prepMinutes, cookMinutes, sourceUrl]
      properties:
        instructions:
          type: string
          description: Plain text, one step per line.
        prepMinutes:
          type: integer
          nullable: true
        cookMinutes:
          type: integer
          nullable: true
        sourceUrl:
          type: string
          nullable: true
    RecipeInput:
      type: object
      additionalProperties: false
      properties:
        instructions:
          type: string
          maxLength: 20000
        prepMinutes:
          type: integer
          minimum: 0
          maximum: 1440
          nullable: true
        cookMinutes:
          type: integer
          minimum: 0
          maximum: 1440
          nullable: true
        sourceUrl:
          type: string
          maxLength: 2048
          nullable: true
          description: An http or https link.

    MealSummary:
      type: object
      required:
        [id, name, servings, cuisine, allergens, dietaryTags, calories, costPence, hasRecipe, prepMinutes, cookMinutes, bookMealId, edited]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        servings:
          type: integer
          nullable: true
        cuisine:
          type: string
          nullable: true
        allergens:
          type: array
          items:
            $ref: "#/components/schemas/Allergen"
        dietaryTags:
          type: array
          items:
            $ref: "#/components/schemas/DietaryTag"
        calories:
          type: integer
          nullable: true
          description: kcal per serving.
        costPence:
          type: integer
          nullable: true
          description: Per serving.
        hasRecipe:
          type: boolean
        prepMinutes:
          type: integer
          nullable: true
        cookMinutes:
          type: integer
          nullable: true
        bookMealId:
          type: string
          format: uuid
          x-go-type: string
          nullable: true
          description: The book meal this was copied from; null for the family's own.
        edited:
          type: boolean
          description: A copy of a book meal that the family has changed.
    MealList:
      type: object
      required: [meals]
      properties:
        meals:
          type: array
          items:
            $ref: "#/components/schemas/MealSummary"
    Meal:
      type: object
      required:
        [
          id,
          name,
          description,
          servings,
          cuisine,
          allergens,
          dietaryTags,
          macros,
          micros,
          costPence,
          ingredients,
          recipe,
          bookMealId,
          edited,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        description:
          type: string
        servings:
          type: integer
          nullable: true
          description: What the numbers and ingredient amounts are based on.
        cuisine:
          type: string
          nullable: true
        allergens:
          type: array
          items:
            $ref: "#/components/schemas/Allergen"
        dietaryTags:
          type: array
          items:
            $ref: "#/components/schemas/DietaryTag"
        macros:
          $ref: "#/components/schemas/Macros"
        micros:
          type: array
          items:
            $ref: "#/components/schemas/Micro"
        costPence:
          type: integer
          nullable: true
          description: Estimated cost per serving, in pence.
        ingredients:
          type: array
          description: In the order entered.
          items:
            $ref: "#/components/schemas/Ingredient"
        recipe:
          allOf:
            - $ref: "#/components/schemas/Recipe"
          nullable: true
          description: Null for a meal with nothing to cook.
        bookMealId:
          type: string
          format: uuid
          x-go-type: string
          nullable: true
          description: The book meal this was copied from; null for the family's own.
        edited:
          type: boolean
          description: A copy of a book meal that the family has changed.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SaveMealRequest:
      type: object
      additionalProperties: false
      description: >
        The whole meal. On an update anything left out is cleared, and leaving
        `recipe` out removes the recipe.
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        servings:
          type: integer
          minimum: 1
          maximum: 50
          nullable: true
        cuisine:
          type: string
          maxLength: 50
          nullable: true
        allergens:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Allergen"
        dietaryTags:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/DietaryTag"
        macros:
          $ref: "#/components/schemas/Macros"
        micros:
          type: array
          description: At most one entry per nutrient.
          maxItems: 13
          items:
            $ref: "#/components/schemas/Micro"
        costPence:
          type: integer
          minimum: 0
          nullable: true
        ingredients:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/IngredientInput"
        recipe:
          allOf:
            - $ref: "#/components/schemas/RecipeInput"
          nullable: true
    IngredientNameList:
      type: object
      required: [names]
      properties:
        names:
          type: array
          items:
            type: string

    BookMealSummary:
      type: object
      required:
        [id, name, servings, cuisine, allergens, dietaryTags, calories, costPence, hasRecipe, prepMinutes, cookMinutes, status, mealId]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        servings:
          type: integer
          nullable: true
        cuisine:
          type: string
          nullable: true
        allergens:
          type: array
          items:
            $ref: "#/components/schemas/Allergen"
        dietaryTags:
          type: array
          items:
            $ref: "#/components/schemas/DietaryTag"
        calories:
          type: integer
          nullable: true
        costPence:
          type: integer
          nullable: true
        hasRecipe:
          type: boolean
        prepMinutes:
          type: integer
          nullable: true
        cookMinutes:
          type: integer
          nullable: true
        status:
          $ref: "#/components/schemas/BookStatus"
        mealId:
          type: string
          format: uuid
          x-go-type: string
          nullable: true
          description: The family's copy; null when `status` is `not_added`.
    RecipeBook:
      type: object
      required: [enabled, meals]
      properties:
        enabled:
          type: boolean
        meals:
          type: array
          items:
            $ref: "#/components/schemas/BookMealSummary"
    SetRecipeBookEnabledRequest:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
    BookMeal:
      type: object
      required:
        [
          id,
          name,
          description,
          servings,
          cuisine,
          allergens,
          dietaryTags,
          macros,
          micros,
          costPence,
          ingredients,
          recipe,
          status,
          mealId,
        ]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        description:
          type: string
        servings:
          type: integer
          nullable: true
        cuisine:
          type: string
          nullable: true
        allergens:
          type: array
          items:
            $ref: "#/components/schemas/Allergen"
        dietaryTags:
          type: array
          items:
            $ref: "#/components/schemas/DietaryTag"
        macros:
          $ref: "#/components/schemas/Macros"
        micros:
          type: array
          items:
            $ref: "#/components/schemas/Micro"
        costPence:
          type: integer
          nullable: true
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/Ingredient"
        recipe:
          allOf:
            - $ref: "#/components/schemas/Recipe"
          nullable: true
        status:
          $ref: "#/components/schemas/BookStatus"
        mealId:
          type: string
          format: uuid
          x-go-type: string
          nullable: true
          description: The family's copy; null when `status` is `not_added`.

    PlanMeal:
      type: object
      description: Enough of a planned meal to show the entry and add up a week.
      required: [id, name, servings, calories, costPence]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        servings:
          type: integer
          nullable: true
        calories:
          type: integer
          nullable: true
          description: kcal per serving.
        costPence:
          type: integer
          nullable: true
          description: Per serving.
    PlanEntry:
      type: object
      required: [id, date, slot, position, title, meal, servings, note, createdAt, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        date:
          $ref: "#/components/schemas/Date"
        slot:
          $ref: "#/components/schemas/MealSlot"
        position:
          type: integer
          description: Order within the slot.
        title:
          type: string
          description: The meal's current name, or the free text.
        meal:
          allOf:
            - $ref: "#/components/schemas/PlanMeal"
          nullable: true
          description: Null for a free-text entry.
        servings:
          type: integer
          nullable: true
          description: Servings planned; null uses the meal's own.
        note:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MealPlan:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/PlanEntry"
    CreatePlanEntryRequest:
      type: object
      additionalProperties: false
      description: Give `mealId` for a meal entry or `title` for free text, not both.
      required: [date]
      properties:
        date:
          $ref: "#/components/schemas/Date"
        slot:
          $ref: "#/components/schemas/MealSlot"
        position:
          type: integer
          minimum: 0
        mealId:
          $ref: "#/components/schemas/Id"
        title:
          type: string
          minLength: 1
          maxLength: 120
        servings:
          type: integer
          minimum: 1
          maximum: 50
          nullable: true
        note:
          type: string
          maxLength: 500
    UpdatePlanEntryRequest:
      type: object
      additionalProperties: false
      description: >
        Only the fields given change. `mealId` swaps the meal; `title` turns
        the entry into free text.
      properties:
        date:
          $ref: "#/components/schemas/Date"
        slot:
          $ref: "#/components/schemas/MealSlot"
        position:
          type: integer
          minimum: 0
        mealId:
          $ref: "#/components/schemas/Id"
        title:
          type: string
          minLength: 1
          maxLength: 120
        servings:
          type: integer
          minimum: 1
          maximum: 50
          nullable: true
        note:
          type: string
          maxLength: 500

    ShoppingItemOrigin:
      type: string
      description: "`generated` lines come from the plan and can only be ticked."
      enum: [generated, manual]
    ShoppingItem:
      type: object
      required: [id, origin, name, quantity, unit, category, sources, checked, checkedAt, checkedBy]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        origin:
          $ref: "#/components/schemas/ShoppingItemOrigin"
        name:
          type: string
        quantity:
          type: number
          format: double
          nullable: true
        unit:
          allOf:
            - $ref: "#/components/schemas/Unit"
          nullable: true
        category:
          allOf:
            - $ref: "#/components/schemas/IngredientCategory"
          nullable: true
        sources:
          type: array
          description: Names of the meals a generated line came from.
          items:
            type: string
        checked:
          type: boolean
        checkedAt:
          type: string
          format: date-time
          nullable: true
        checkedBy:
          type: string
          format: uuid
          x-go-type: string
          nullable: true
          description: The profile that ticked it.
    ShoppingList:
      type: object
      required: [id, weekStart, generatedAt, stale, items]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        weekStart:
          $ref: "#/components/schemas/Date"
        generatedAt:
          type: string
          format: date-time
          nullable: true
          description: Null while the list holds only manual items.
        stale:
          type: boolean
          description: Regenerating now would produce different lines.
        items:
          type: array
          items:
            $ref: "#/components/schemas/ShoppingItem"
    CreateShoppingItemRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        quantity:
          type: number
          format: double
          exclusiveMinimum: true
          minimum: 0
          nullable: true
        unit:
          allOf:
            - $ref: "#/components/schemas/Unit"
          nullable: true
        category:
          allOf:
            - $ref: "#/components/schemas/IngredientCategory"
          nullable: true
    UpdateShoppingItemRequest:
      type: object
      additionalProperties: false
      description: >
        Only the fields given change. `checked` sets the tick (it is not a
        toggle) and is allowed on any item. The other fields are for manual
        items only; on a generated line they are refused (422).
      properties:
        checked:
          type: boolean
        name:
          type: string
          minLength: 1
          maxLength: 80
        quantity:
          type: number
          format: double
          exclusiveMinimum: true
          minimum: 0
          nullable: true
        unit:
          allOf:
            - $ref: "#/components/schemas/Unit"
          nullable: true
        category:
          allOf:
            - $ref: "#/components/schemas/IngredientCategory"
          nullable: true
